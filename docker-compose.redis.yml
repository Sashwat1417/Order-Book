services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    # Bounded memory + eviction so the dedupe cache can't grow unbounded.
    # Defaults can be overridden via env vars when running docker compose.
    command:
      - "redis-server"
      - "--appendonly"
      - "no"
      - "--maxmemory"
      - "${REDIS_MAXMEMORY:-256mb}"
      - "--maxmemory-policy"
      - "${REDIS_MAXMEMORY_POLICY:-allkeys-lru}"

  redisinsight:
    image: redis/redisinsight:latest
    ports:
      - "5540:5540"
    depends_on:
      - redis
